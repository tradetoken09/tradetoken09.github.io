<script>
"use strict";

/* =========================================
   TT TOKEN • PI TESTNET CONFIGURATION
========================================= */

const RENDER_BACKEND_URL =
  "https://trade-token-github-io.onrender.com";

const RATE_PER_SECOND = 0.24 / 3600;

let piUser = null;
let piAccessToken = null;
let isPiInitialized = false;

let miningInterval = null;
let miningBalance = 0;
let claimedBalance = 0;
let lastMiningUpdate = 0;
let isMining = false;

let selectedPetName = "";
let selectedPetPrice = 1;

let pendingIncompletePayment = null;

/* =========================================
   HELPER
========================================= */

const $ = id => document.getElementById(id);

function setStatus(text) {
  if ($("status")) {
    $("status").textContent = text;
  }
}

function updateDisplays() {
  if ($("balance")) {
    $("balance").textContent =
      miningBalance.toFixed(6) + " TT";
  }

  if ($("claimedBalance")) {
    $("claimedBalance").textContent =
      claimedBalance.toFixed(4);
  }
}

/* =========================================
   NAVIGATION
========================================= */

function switchTab(tabId, element) {
  document
    .querySelectorAll(".tab-content")
    .forEach(x => x.classList.remove("active"));

  document
    .querySelectorAll(".nav-item")
    .forEach(x => x.classList.remove("active"));

  const tab = $(tabId);

  if (tab) {
    tab.classList.add("active");
  }

  if (element) {
    element.classList.add("active");
  }
}

/* =========================================
   REFERRAL
========================================= */

function copyReferral() {
  const invite = $("invite");

  if (!invite) return;

  const text = invite.textContent.trim();

  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {
    navigator.clipboard
      .writeText(text)
      .then(() => {
        alert("✅ Referral link copied!");
      })
      .catch(() => {
        window.prompt(
          "Copy your referral link:",
          text
        );
      });
  } else {
    window.prompt(
      "Copy your referral link:",
      text
    );
  }
}

/* =========================================
   PET MODAL
========================================= */

function openPetModal(card) {
  selectedPetName =
    card.dataset.name || "";

  selectedPetPrice =
    Number(card.dataset.price);

  if (
    !selectedPetName ||
    !Number.isFinite(selectedPetPrice) ||
    selectedPetPrice <= 0
  ) {
    alert("❌ Invalid pet information.");
    return;
  }

  $("modalPetImg").src =
    card.dataset.img || "";

  $("modalPetName").textContent =
    selectedPetName;

  $("modalPetRarity").textContent =
    card.dataset.rarity || "Common";

  $("modalPetBoost").textContent =
    card.dataset.boost || "";

  $("modalPetAbility").textContent =
    card.dataset.ability || "";

  $("modalPetDesc").textContent =
    card.dataset.desc || "";

  $("modalBuyBtn").textContent =
    "🛒 BUY WITH " +
    selectedPetPrice +
    " TEST-PI";

  $("petModal").classList.add("show");
}

function closePetModal() {
  $("petModal").classList.remove("show");
}

/* =========================================
   PI SDK INITIALIZATION
========================================= */

async function initPiSDK() {

  if (!window.Pi) {
    console.error(
      "❌ Pi SDK was not found."
    );

    return false;
  }

  if (isPiInitialized) {
    return true;
  }

  try {

    /*
      TESTNET / SANDBOX MODE
    */

    await window.Pi.init({
      version: "2.0",
      sandbox: true
    });

    isPiInitialized = true;

    console.log(
      "✅ Pi SDK initialized in TESTNET/SANDBOX mode."
    );

    return true;

  } catch (error) {

    console.error(
      "❌ Pi SDK initialization error:",
      error
    );

    return false;
  }
}

/* =========================================
   PI LOGIN
========================================= */

async function triggerPiLogin() {

  const btn = $("authBtn");
  const badge = $("liveBadge");

  if (!window.Pi) {

    setStatus(
      "⚠️ PI SDK NOT FOUND"
    );

    alert(
      "Pi SDK was not detected.\n\n" +
      "Please open TT Token inside Pi Browser."
    );

    return;
  }

  btn.disabled = true;
  btn.textContent =
    "⏳ CONNECTING...";

  setStatus(
    "Initializing Pi SDK..."
  );

  badge.textContent =
    "• CONNECTING";

  try {

    const initialized =
      await initPiSDK();

    if (!initialized) {
      throw new Error(
        "Pi SDK initialization failed."
      );
    }

    setStatus(
      "Waiting for Pi authorization..."
    );

    pendingIncompletePayment = null;

    const result =
      await window.Pi.authenticate(
        [
          "username",
          "payments"
        ],

        function onIncompletePaymentFound(payment) {

          console.log(
            "🔄 Incomplete Pi payment found:",
            payment
          );

          pendingIncompletePayment =
            payment;
        }
      );

    if (
      !result ||
      !result.user ||
      !result.user.uid
    ) {
      throw new Error(
        "Pi authentication returned no valid user."
      );
    }

    piUser = result.user;

    piAccessToken =
      result.accessToken || null;

    if (!piAccessToken) {
      throw new Error(
        "Pi access token was not returned."
      );
    }

    console.log(
      "✅ Pi user authenticated:",
      piUser
    );

    /*
      RECOVER INCOMPLETE PAYMENT
    */

    if (
      pendingIncompletePayment &&
      pendingIncompletePayment.identifier &&
      pendingIncompletePayment.transaction &&
      pendingIncompletePayment.transaction.txid
    ) {

      try {

        console.log(
          "🔄 Recovering incomplete payment:",
          pendingIncompletePayment.identifier
        );

        const recoveryResponse =
          await fetch(
            RENDER_BACKEND_URL +
            "/api/payments/complete",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                paymentId:
                  pendingIncompletePayment.identifier,

                txid:
                  pendingIncompletePayment.transaction.txid,

                uid:
                  piUser.uid,

                accessToken:
                  piAccessToken
              })
            }
          );

        const recoveryData =
          await recoveryResponse
            .json()
            .catch(() => ({}));

        console.log(
          "Recovery response:",
          recoveryResponse.status,
          recoveryData
        );

      } catch (error) {

        console.error(
          "Incomplete payment recovery error:",
          error
        );

      } finally {

        pendingIncompletePayment =
          null;
      }
    }

    $("username").textContent =
      "@" +
      (piUser.username || "Pioneer");

    $("piUid").textContent =
      piUser.uid.substring(0, 8) +
      "...";

    $("invite").textContent =
      "https://tradetoken09.github.io?ref=" +
      encodeURIComponent(
        piUser.username || ""
      );

    setStatus(
      "SYSTEM ONLINE • CONNECTED"
    );

    badge.textContent =
      "• LIVE";

    btn.style.display =
      "none";

    $("mineBtn").disabled =
      false;

    console.log(
      "✅ Pi connection successful."
    );

  } catch (error) {

    console.error(
      "❌ Pi authentication error:",
      error
    );

    piUser = null;
    piAccessToken = null;

    setStatus(
      "❌ PI AUTHENTICATION FAILED"
    );

    badge.textContent =
      "• OFFLINE";

    btn.textContent =
      "🔑 RETRY CONNECT PI ACCOUNT";

    btn.disabled = false;

    alert(
      "Pi connection failed.\n\n" +
      (error.message ||
        String(error))
    );
  }
}

/* =========================================
   MINING
========================================= */

function startMining() {

  if (!piUser) {

    alert(
      "🔑 Please connect your Pi account first."
    );

    return;
  }

  if (isMining) {
    return;
  }

  isMining = true;

  lastMiningUpdate =
    Date.now();

  $("mineBtn").disabled =
    true;

  $("mineBtn").textContent =
    "⛏️ MINING...";

  $("claimBtn").disabled =
    false;

  setStatus(
    "⛏️ MINING ACTIVE • 0.24 TT / HOUR"
  );

  miningInterval =
    setInterval(() => {

      const now =
        Date.now();

      miningBalance +=
        RATE_PER_SECOND *
        ((now - lastMiningUpdate) / 1000);

      lastMiningUpdate =
        now;

      updateDisplays();

    }, 1000);
}

/* =========================================
   MINING CLAIM
========================================= */

async function claimMiningReward() {

  if (!piUser) {

    alert(
      "🔑 Please connect your Pi account first."
    );

    return;
  }

  if (isMining) {

    const now =
      Date.now();

    miningBalance +=
      RATE_PER_SECOND *
      ((now - lastMiningUpdate) / 1000);

    lastMiningUpdate =
      now;

    clearInterval(
      miningInterval
    );

    miningInterval =
      null;

    isMining =
      false;
  }

  const reward =
    miningBalance;

  if (reward <= 0) {

    alert(
      "⚠️ No TT reward available yet."
    );

    return;
  }

  const btn =
    $("claimBtn");

  btn.disabled =
    true;

  btn.textContent =
    "⏳ CLAIMING...";

  try {

    const response =
      await fetch(
        RENDER_BACKEND_URL +
        "/api/mining/claim",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            wallet: piUser.uid
          })
        }
      );

    const data =
      await response
        .json()
        .catch(() => ({}));

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Backend HTTP " +
        response.status
      );
    }

    miningBalance =
      0;

    claimedBalance =
      data.balance !== undefined
        ? Number(data.balance)
        : claimedBalance + reward;

    updateDisplays();

    $("mineBtn").disabled =
      false;

    $("mineBtn").textContent =
      "⚡ START MINING";

    setStatus(
      "SYSTEM ONLINE • CLAIM SUCCESSFUL"
    );

    alert(
      "🎉 TT CLAIM SUCCESSFUL!\n\n" +
      "Amount: " +
      reward.toFixed(6) +
      " TT"
    );

  } catch (error) {

    console.error(
      "❌ Claim error:",
      error
    );

    $("mineBtn").disabled =
      false;

    $("mineBtn").textContent =
      "⚡ START MINING";

    setStatus(
      "SYSTEM ONLINE • CLAIM FAILED"
    );

    alert(
      "❌ Claim was not completed.\n\n" +
      "Your TT amount was not cleared.\n\n" +
      (error.message ||
        String(error))
    );

  } finally {

    btn.disabled =
      miningBalance <= 0;

    btn.textContent =
      "🎁 CLAIM TT";
  }
}

/* =========================================
   BUY PET • PI PAYMENT
========================================= */

async function buyPet() {

  if (!piUser) {

    alert(
      "🔑 Please connect your Pi account first."
    );

    return;
  }

  if (!piAccessToken) {

    alert(
      "❌ Pi access token is missing.\n\n" +
      "Please reconnect your Pi account."
    );

    return;
  }

  if (
    !selectedPetName ||
    !Number.isFinite(selectedPetPrice) ||
    selectedPetPrice <= 0
  ) {

    alert(
      "❌ Invalid pet selection."
    );

    return;
  }

  if (!window.Pi) {

    alert(
      "❌ Pi SDK is not available.\n\n" +
      "Please open TT Token inside Pi Browser."
    );

    return;
  }

  const initialized =
    await initPiSDK();

  if (!initialized) {

    alert(
      "❌ Pi SDK is not ready."
    );

    return;
  }

  const btn =
    $("modalBuyBtn");

  const originalText =
    btn.textContent;

  btn.disabled =
    true;

  btn.textContent =
    "⏳ OPENING PI PAYMENT...";

  console.log(
    "🛒 Starting pet purchase:",
    {
      pet: selectedPetName,
      price: selectedPetPrice,
      uid: piUser.uid
    }
  );

  try {

    window.Pi.createPayment(

      {
        amount:
          selectedPetPrice,

        memo:
          "TT Token Pet: " +
          selectedPetName,

        metadata: {
          productType:
            "pet",

          petName:
            selectedPetName,

          price:
            selectedPetPrice
        }
      },

      {

        /* =============================
           SERVER APPROVAL
        ============================= */

        onReadyForServerApproval:
          async function(paymentId) {

            console.log(
              "🟡 PAYMENT APPROVAL REQUEST:",
              paymentId
            );

            try {

              const response =
                await fetch(
                  RENDER_BACKEND_URL +
                  "/api/payments/approve",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                      paymentId:
                        paymentId,

                      uid:
                        piUser.uid,

                      accessToken:
                        piAccessToken
                    })
                  }
                );

              const data =
                await response
                  .json()
                  .catch(() => ({}));

              console.log(
                "🟢 APPROVAL RESPONSE:",
                response.status,
                data
              );

              if (
                !response.ok ||
                !data.success
              ) {

                throw new Error(
                  data.error ||
                  "Payment approval failed."
                );
              }

              console.log(
                "✅ PAYMENT APPROVED:",
                paymentId
              );

            } catch (error) {

              console.error(
                "❌ APPROVAL ERROR:",
                error
              );

              alert(
                "❌ Payment approval failed.\n\n" +
                (error.message ||
                  String(error))
              );

              throw error;
            }
          },

        /* =============================
           SERVER COMPLETION
        ============================= */

        onReadyForServerCompletion:
          async function(paymentId, txid) {

            console.log(
              "🟡 PAYMENT COMPLETION REQUEST:",
              {
                paymentId,
                txid
              }
            );

            try {

              if (!txid) {

                throw new Error(
                  "Pi did not provide a transaction ID."
                );
              }

              const response =
                await fetch(
                  RENDER_BACKEND_URL +
                  "/api/payments/complete",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                      paymentId:
                        paymentId,

                      txid:
                        txid,

                      uid:
                        piUser.uid,

                      accessToken:
                        piAccessToken
                    })
                  }
                );

              const data =
                await response
                  .json()
                  .catch(() => ({}));

              console.log(
                "🟢 COMPLETION RESPONSE:",
                response.status,
                data
              );

              if (
                !response.ok ||
                !data.success
              ) {

                throw new Error(
                  data.error ||
                  "Payment completion failed."
                );
              }

              console.log(
                "✅ PAYMENT COMPLETED:",
                data
              );

              closePetModal();

              setStatus(
                "SYSTEM ONLINE • PET PURCHASE SUCCESSFUL"
              );

              alert(
                "🎉 PET PURCHASE SUCCESSFUL!\n\n" +
                "Pet: " +
                selectedPetName +
                "\nPrice: " +
                selectedPetPrice +
                " TEST-PI" +
                "\n\nTransaction: " +
                txid
              );

            } catch (error) {

              console.error(
                "❌ COMPLETION ERROR:",
                error
              );

              alert(
                "⚠️ Pi payment was submitted, " +
                "but TT server could not confirm it yet.\n\n" +
                (error.message ||
                  String(error))
              );

            } finally {

              btn.disabled =
                false;

              btn.textContent =
                originalText;
            }
          },

        /* =============================
           PAYMENT CANCEL
        ============================= */

        onCancel:
          function(paymentId) {

            console.log(
              "⏰ Pi payment cancelled/expired:",
              paymentId
            );

            btn.disabled =
              false;

            btn.textContent =
              originalText;

            setStatus(
              "SYSTEM ONLINE • PAYMENT CANCELLED"
            );

            alert(
              "⏰ Pi payment expired or was cancelled.\n\n" +
              "No pet was purchased.\n\n" +
              "Please start the BUY process again."
            );
          },

        /* =============================
           PAYMENT ERROR
        ============================= */

        onError:
          function(error, payment) {

            console.error(
              "❌ PI PAYMENT ERROR:",
              error,
              payment
            );

            btn.disabled =
              false;

            btn.textContent =
              originalText;

            setStatus(
              "SYSTEM ONLINE • PAYMENT FAILED"
            );

            const message =
              error?.message ||
              error?.error ||
              String(error);

            alert(
              "❌ Pi payment failed.\n\n" +
              message
            );
          }
      }
    );

  } catch (error) {

    console.error(
      "❌ createPayment error:",
      error
    );

    btn.disabled =
      false;

    btn.textContent =
      originalText;

    alert(
      "❌ Could not start Pi payment.\n\n" +
      (error.message ||
        String(error))
    );
  }
}

/* =========================================
   PAGE INITIALIZATION
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    $("authBtn")
      .addEventListener(
        "click",
        triggerPiLogin
      );

    $("mineBtn")
      .addEventListener(
        "click",
        startMining
      );

    $("claimBtn")
      .addEventListener(
        "click",
        claimMiningReward
      );

    $("copyReferralBtn")
      .addEventListener(
        "click",
        copyReferral
      );

    $("closePetBtn")
      .addEventListener(
        "click",
        closePetModal
      );

    $("petModal")
      .addEventListener(
        "click",
        e => {
          if (
            e.target ===
            $("petModal")
          ) {
            closePetModal();
          }
        }
      );

    $("modalBuyBtn")
      .addEventListener(
        "click",
        buyPet
      );

    document
      .querySelectorAll(".nav-item")
      .forEach(item => {

        item.addEventListener(
          "click",
          e => {

            e.preventDefault();

            switchTab(
              item.dataset.tab,
              item
            );
          }
        );
      });

    document
      .querySelectorAll(".pet-card")
      .forEach(card => {

        card.addEventListener(
          "click",
          () => {
            openPetModal(card);
          }
        );
      });

    $("mineBtn").disabled =
      false;

    $("claimBtn").disabled =
      true;

    updateDisplays();

    console.log(
      "✅ TT Token initialized."
    );

    console.log(
      "Backend:",
      RENDER_BACKEND_URL
    );

    console.log(
      "Pi Testnet/Sandbox mode: ENABLED"
    );
  }
);
</script>
